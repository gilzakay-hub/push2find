# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: Push2find
options:
  bundleIdPrefix: com.push2find
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Push2find:
    type: application
    platform: iOS
    sources:
      - path: Push2find
        excludes:
          - Info.plist
          - Push2find.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.push2find.app
        INFOPLIST_FILE: Push2find/Info.plist
        CODE_SIGN_ENTITLEMENTS: Push2find/Push2find.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""          # ← put your Apple Team ID here
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
