name: Build & release

on:
  push:
    branches: [main, "design/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Push2find.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Push2find.apk

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Render screens
        working-directory: android
        run: gradle recordRoborazziDebug --stacktrace
      - name: Save screenshots to the repo (docs/screenshots)
        run: |
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          cp android/app/build/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update screenshots [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Could not push screenshots"

  simulator:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r simulator/requirements.txt pyinstaller
          pip install --no-deps bless==0.2.6
          python -c "import importlib.metadata as m; print(*m.requires('bless'), sep='\n')"
          pip list
          python simulator/wristband_sim.py --selftest st.txt || true
          cat st.txt
          test "$(head -1 st.txt)" = OK
      - name: Build
        run: python simulator/build/build.py
      - name: Smoke-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath simulator\dist\Push2find-Simulator.exe -ArgumentList '--selftest', "$PWD\st-exe.txt" -Wait
          Get-Content st-exe.txt
          if ((Get-Content st-exe.txt -First 1) -ne 'OK') { exit 1 }
      - name: Smoke-test packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          simulator/dist/Push2find-Simulator.app/Contents/MacOS/Push2find-Simulator --selftest "$PWD/st-app.txt" || true
          cat st-app.txt
          test "$(head -1 st-app.txt)" = OK
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cp simulator/dist/Push2find-Simulator.exe Push2find-Simulator-Windows.exe
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=simulator/dist/Push2find-Simulator.app
          /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'The simulator acts as a Push2find wristband over Bluetooth.'" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Push2find-Simulator-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-${{ runner.os }}
          path: |
            Push2find-Simulator-Windows.exe
            Push2find-Simulator-Mac.zip
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild -project Push2find.xcodeproj -target Push2find -sdk iphoneos -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Release-iphoneos/Push2find.app
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/build/Release-iphoneos/Push2find.app Payload/
          zip -qry Push2find-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Push2find-iOS-unsigned.ipa

  testflight:
    # Signs with the App Store Connect API key and uploads to TestFlight.
    # Needs repo secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8. Skipped until they exist.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight secrets not set yet - skipping upload"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: Archive, sign and upload
        if: steps.check.outputs.ready == 'true'
        run: |
          brew install xcodegen
          (cd ios && xcodegen generate)
          KEY="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -project ios/Push2find.xcodeproj -scheme Push2find -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Push2find.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" "${AUTH[@]}" | tail -30
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Push2find.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          rm -f "$KEY"

  release:
    needs: [android, ios, simulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "build-${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" \
            --title "Push2find build ${{ github.run_number }}" \
            --notes "Android: Push2find.apk · iPhone (unsigned, install with Sideloadly/Xcode): Push2find-iOS-unsigned.ipa · Computer: Push2find-Simulator-Windows.exe / Push2find-Simulator-Mac.zip" \
            --latest
