name: diag
on:
  push:
    branches: [diag]
jobs:
  win:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {py: "3.12", pkgs: "bless==0.3.0"}
          - {py: "3.13", pkgs: "bless==0.3.0"}
          - {py: "3.11", pkgs: "bleak==0.21.1 bleak-winrt==1.2.0 && pip install --no-deps bless==0.2.6"}
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - shell: bash
        run: |
          pip install ${{ matrix.pkgs }} 2>&1 | tail -15
          pip list | grep -iE "bless|bleak|winrt"
          python -c "import bless, sys; from bless import BlessServer, GATTCharacteristicProperties, GATTAttributePermissions; print('IMPORT_OK', sys.version)"
